name: "Base Feature Set"
description: "Minimal feature set with core stats and advanced efficiency metrics"
version: "3.0.0"

rolling_windows: [3, 5, 10]
ewma_span: 5

stats:
  - pts
  - reb
  - ast
  - stl
  - blk
  - mins

transformers:
  - type: efficiency_metrics
    params: {}

  - type: playmaking_metrics
    params: {}

  - type: impact_metrics
    params: {}

  - type: rolling_stats
    params:
      windows: [3, 5, 10]
      include_std: true

  - type: ewma
    params:
      span: 5

  - type: target
    params:
      target_col: fantasyPoints
      shift_periods: -1
