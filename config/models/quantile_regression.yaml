model_type: quantile
description: "Quantile regression model - predicts floor/median/ceiling for fantasy points"

hyperparameters:
  max_depth: 6
  learning_rate: 0.05
  n_estimators: 200
  min_child_weight: 5
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  tree_method: hist

  # Quantiles to predict
  quantiles: [0.1, 0.5, 0.9]  # floor (10th), median (50th), ceiling (90th)
